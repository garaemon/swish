packages:
  - 'apps/*'
  - 'packages/*'
# Native binaries that need their installer scripts to run. pnpm 11 refuses
# to install otherwise.
#   sharp        — Next.js image optimisation
#   unrs-resolver — eslint resolver used by next/lint
#   esbuild      — tsup (used by @swish/cli) prebuilds an esbuild binary
#   workerd      — Cloudflare Workers runtime used by wrangler/OpenNext preview
#   spawn-sync   — transitive dep of wxt (web-ext-run) via @swish/extension;
#                  its postinstall is a no-op on modern node (spawnSync is
#                  built in) but must be approved so `pnpm install` exits 0
allowBuilds:
  esbuild: true
  sharp: true
  spawn-sync: true
  unrs-resolver: true
  workerd: true
