packages:
  - 'apps/*'
  - 'packages/*'
# Native binaries that need their installer scripts to run. pnpm 11 refuses
# to install otherwise.
#   sharp        — Next.js image optimisation
#   unrs-resolver — eslint resolver used by next/lint
#   esbuild      — tsup (used by @swish/cli) prebuilds an esbuild binary
#   workerd      — Cloudflare Workers runtime used by wrangler/OpenNext preview
#   spawn-sync   — reached only via wxt -> web-ext-run -> fx-runner, the
#                  Firefox launcher. @swish/extension is Chrome-only, so this
#                  code path never runs; its postinstall is a no-op on modern
#                  node (spawnSync is built in) but pnpm 11 still requires
#                  approval for `pnpm install` to exit 0
allowBuilds:
  esbuild: true
  sharp: true
  spawn-sync: true
  unrs-resolver: true
  workerd: true
